services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ragagent}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env or the shell}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 12

  qdrant:
    image: qdrant/qdrant:v1.18.1
    volumes:
      - qdrant_index_data:/qdrant/storage
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - >-
          exec 3<>/dev/tcp/127.0.0.1/6333;
          printf 'GET /readyz HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3;
          IFS=' ' read -r protocol status rest <&3;
          test "$$status" = 200
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    command:
      - sh
      - -ec
      - >-
        python -m backend.app.models.init_db &&
        exec python -m uvicorn backend.app.main:app --host 0.0.0.0 --port 8000
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-ragagent}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env or the shell}
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_COLLECTION
      - LLM_API_KEY
      - LLM_BASE_URL
      - LLM_MODEL
      - LLM_TIMEOUT_SECONDS
      - LLM_EXTRA_BODY
      - ADMIN_TRACE_TOKEN
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    volumes:
      - backend_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=3).close()"]
      interval: 5s
      timeout: 5s
      retries: 12

  frontend:
    build:
      context: ./frontend
      additional_contexts:
        document_formats: ./backend/app
        streamlit_config: ./.streamlit
    depends_on:
      backend:
        condition: service_healthy
    environment:
      RAG_BACKEND_URL: http://backend:8000
    ports:
      - "127.0.0.1:${STREAMLIT_PORT:-8501}:8501"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3).close()"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
  qdrant_index_data:
    # Use the standalone volume name, with a distinct key from the prior empty volume.
    name: ${COMPOSE_PROJECT_NAME}-qdrant-data
  backend_data:
